<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Peach · שירות לקוחות</title>
  <meta name="theme-color" content="#FFB899">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.svg" alt="" width="40" height="40">
      <div>
        <div class="brand-name">Neon Peach</div>
        <div class="brand-sub">שירות לקוחות</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="bellBtn" aria-label="פניות חדשות">🔔<span class="badge" id="bellCount">0</span></button>
      <div class="me" title="מאיה · שירות לקוחות">👩</div>
    </div>
  </header>

  <nav class="nav" aria-label="ניווט ראשי">
    <button class="nav-item active" data-view="dashboard"><span>🏠</span>דאשבורד</button>
    <button class="nav-item" data-view="tickets"><span>📋</span>פניות</button>
    <button class="nav-item" data-view="tonight"><span>📅</span>הערב</button>
    <button class="nav-reset js-reset" id="resetBtn" title="החזרת הנתונים למצב ההתחלתי">↺ איפוס דמו</button>
  </nav>

  <main class="main">
    <!-- Dashboard -->
    <section class="view active" id="view-dashboard">
      <h1 class="view-title">היי מאיה 👋 <small id="todayLabel"></small></h1>
      <div class="kpis" id="kpis"></div>
      <div class="charts">
        <div class="card chart-card wide"><h2>פניות לפי יום · 14 ימים</h2><div class="chart-box"><canvas id="chartDays"></canvas></div></div>
        <div class="card chart-card"><h2>פניות לפי סוג</h2><div class="chart-box"><canvas id="chartCats"></canvas></div></div>
        <div class="card chart-card"><h2>פניות לפי ערוץ</h2><div class="chart-box"><canvas id="chartChannels"></canvas></div></div>
      </div>
      <div class="card">
        <h2>🚨 דורש טיפול דחוף</h2>
        <div class="list" id="urgentList"></div>
      </div>
      <div class="demo-footer">
        <span>🍑 מערכת לדוגמה · כל הנתונים בדויים</span>
        <button class="btn ghost js-reset">↺ איפוס דמו</button>
      </div>
    </section>

    <!-- Tickets -->
    <section class="view" id="view-tickets">
      <h1 class="view-title">פניות <small id="ticketCount"></small></h1>
      <div class="toolbar">
        <input type="search" id="search" placeholder="🔍 חיפוש לפי שם, טלפון, נושא או מזהה" aria-label="חיפוש">
        <select id="sort" aria-label="מיון">
          <option value="new">חדש ← ישן</option>
          <option value="priority">לפי עדיפות</option>
          <option value="status">לפי סטטוס</option>
        </select>
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="ticketList"></div>
    </section>

    <!-- Tonight -->
    <section class="view" id="view-tonight">
      <h1 class="view-title">הזמנות להערב <small id="tonightSummary"></small></h1>
      <div class="list" id="tonightList"></div>
    </section>
  </main>

  <!-- Ticket details -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="drawer-handle"></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/chart.umd.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
